<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#ffffff" rx="10"/>

  <!-- 标题 -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333">
    🌟 3D GitHub Contribution Graph
  </text>

  <!-- 说明文字 -->
  <text x="400" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">
    This graph will be automatically generated by GitHub Actions
  </text>

  <!-- 示例 3D 效果 -->
  <g transform="translate(150, 200)">
    <!-- 第一行 -->
    <rect x="0" y="0" width="40" height="40" fill="#9be9a8" opacity="0.8" rx="2"/>
    <rect x="50" y="0" width="40" height="40" fill="#40c463" opacity="0.8" rx="2"/>
    <rect x="100" y="0" width="40" height="40" fill="#30a14e" opacity="0.8" rx="2"/>
    <rect x="150" y="0" width="40" height="40" fill="#216e39" opacity="0.8" rx="2"/>
    <rect x="200" y="0" width="40" height="40" fill="#9be9a8" opacity="0.8" rx="2"/>
    <rect x="250" y="0" width="40" height="40" fill="#40c463" opacity="0.8" rx="2"/>
    <rect x="300" y="0" width="40" height="40" fill="#30a14e" opacity="0.8" rx="2"/>
    <rect x="350" y="0" width="40" height="40" fill="#216e39" opacity="0.8" rx="2"/>
    <rect x="400" y="0" width="40" height="40" fill="#9be9a8" opacity="0.8" rx="2"/>
    <rect x="450" y="0" width="40" height="40" fill="#40c463" opacity="0.8" rx="2"/>

    <!-- 第二行 -->
    <rect x="0" y="50" width="40" height="40" fill="#40c463" opacity="0.8" rx="2"/>
    <rect x="50" y="50" width="40" height="40" fill="#30a14e" opacity="0.8" rx="2"/>
    <rect x="100" y="50" width="40" height="40" fill="#216e39" opacity="0.8" rx="2"/>
    <rect x="150" y="50" width="40" height="40" fill="#9be9a8" opacity="0.8" rx="2"/>
    <rect x="200" y="50" width="40" height="40" fill="#40c463" opacity="0.8" rx="2"/>
    <rect x="250" y="50" width="40" height="40" fill="#30a14e" opacity="0.8" rx="2"/>
    <rect x="300" y="50" width="40" height="40" fill="#216e39" opacity="0.8" rx="2"/>
    <rect x="350" y="50" width="40" height="40" fill="#9be9a8" opacity="0.8" rx="2"/>
    <rect x="400" y="50" width="40" height="40" fill="#40c463" opacity="0.8" rx="2"/>
    <rect x="450" y="50" width="40" height="40" fill="#30a14e" opacity="0.8" rx="2"/>

    <!-- 第三行 -->
    <rect x="0" y="100" width="40" height="40" fill="#30a14e" opacity="0.8" rx="2"/>
    <rect x="50" y="100" width="40" height="40" fill="#216e39" opacity="0.8" rx="2"/>
    <rect x="100" y="100" width="40" height="40" fill="#9be9a8" opacity="0.8" rx="2"/>
    <rect x="150" y="100" width="40" height="40" fill="#40c463" opacity="0.8" rx="2"/>
    <rect x="200" y="100" width="40" height="40" fill="#30a14e" opacity="0.8" rx="2"/>
    <rect x="250" y="100" width="40" height="40" fill="#216e39" opacity="0.8" rx="2"/>
    <rect x="300" y="100" width="40" height="40" fill="#9be9a8" opacity="0.8" rx="2"/>
    <rect x="350" y="100" width="40" height="40" fill="#40c463" opacity="0.8" rx="2"/>
    <rect x="400" y="100" width="40" height="40" fill="#30a14e" opacity="0.8" rx="2"/>
    <rect x="450" y="100" width="40" height="40" fill="#216e39" opacity="0.8" rx="2"/>

    <!-- 3D 效果阴影 -->
    <g opacity="0.3">
      <rect x="5" y="5" width="40" height="40" fill="#000" rx="2"/>
      <rect x="55" y="5" width="40" height="40" fill="#000" rx="2"/>
      <rect x="105" y="5" width="40" height="40" fill="#000" rx="2"/>
      <rect x="155" y="5" width="40" height="40" fill="#000" rx="2"/>
      <rect x="205" y="5" width="40" height="40" fill="#000" rx="2"/>
      <rect x="255" y="5" width="40" height="40" fill="#000" rx="2"/>
      <rect x="305" y="5" width="40" height="40" fill="#000" rx="2"/>
      <rect x="355" y="5" width="40" height="40" fill="#000" rx="2"/>
      <rect x="405" y="5" width="40" height="40" fill="#000" rx="2"/>
      <rect x="455" y="5" width="40" height="40" fill="#000" rx="2"/>
    </g>
  </g>

  <!-- 底部说明 -->
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#999">
    ⏳ Waiting for GitHub Actions to generate the actual 3D contribution graph...
  </text>

  <!-- 提示信息 -->
  <text x="400" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#aaa">
    The graph will be updated daily automatically
  </text>
</svg>