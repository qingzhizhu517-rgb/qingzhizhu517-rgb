<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#ffffff" rx="10"/>

  <!-- 标题 -->
  <text x="400" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333">
    📊 GitHub Metrics
  </text>

  <!-- 统计卡片 -->
  <g transform="translate(50, 100)">
    <!-- 总提交数 -->
    <rect x="0" y="0" width="200" height="120" fill="#f8f9fa" rx="10" stroke="#e9ecef" stroke-width="1"/>
    <text x="100" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#28a745">
      0
    </text>
    <text x="100" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">
      Total Commits
    </text>

    <!-- 总 Star 数 -->
    <rect x="220" y="0" width="200" height="120" fill="#f8f9fa" rx="10" stroke="#e9ecef" stroke-width="1"/>
    <text x="320" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffc107">
      0
    </text>
    <text x="320" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">
      Total Stars
    </text>

    <!-- PR 数 -->
    <rect x="440" y="0" width="200" height="120" fill="#f8f9fa" rx="10" stroke="#e9ecef" stroke-width="1"/>
    <text x="540" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#17a2b8">
      0
    </text>
    <text x="540" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">
      Pull Requests
    </text>
  </g>

  <!-- 编程语言统计 -->
  <g transform="translate(50, 250)">
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">
      💻 Programming Languages
    </text>

    <!-- 语言进度条 -->
    <g transform="translate(0, 50)">
      <!-- Python -->
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="14" fill="#333">Python</text>
      <rect x="100" y="0" width="500" height="20" fill="#e9ecef" rx="10"/>
      <rect x="100" y="0" width="200" height="20" fill="#3776ab" rx="10"/>
      <text x="620" y="15" font-family="Arial, sans-serif" font-size="12" fill="#666">40%</text>

      <!-- Kotlin -->
      <text x="0" y="55" font-family="Arial, sans-serif" font-size="14" fill="#333">Kotlin</text>
      <rect x="100" y="40" width="500" height="20" fill="#e9ecef" rx="10"/>
      <rect x="100" y="40" width="150" height="20" fill="#7F52FF" rx="10"/>
      <text x="620" y="55" font-family="Arial, sans-serif" font-size="12" fill="#666">30%</text>

      <!-- TypeScript -->
      <text x="0" y="95" font-family="Arial, sans-serif" font-size="14" fill="#333">TypeScript</text>
      <rect x="100" y="80" width="500" height="20" fill="#e9ecef" rx="10"/>
      <rect x="100" y="80" width="100" height="20" fill="#3178C6" rx="10"/>
      <text x="620" y="95" font-family="Arial, sans-serif" font-size="12" fill="#666">20%</text>

      <!-- Java -->
      <text x="0" y="135" font-family="Arial, sans-serif" font-size="14" fill="#333">Java</text>
      <rect x="100" y="120" width="500" height="20" fill="#e9ecef" rx="10"/>
      <rect x="100" y="120" width="50" height="20" fill="#f89820" rx="10"/>
      <text x="620" y="135" font-family="Arial, sans-serif" font-size="12" fill="#666">10%</text>
    </g>
  </g>

  <!-- 活动日历 -->
  <g transform="translate(50, 450)">
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">
      📅 Activity Calendar
    </text>
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="14" fill="#999">
      ⏳ Waiting for GitHub Actions to generate detailed metrics...
    </text>
  </g>

  <!-- 底部信息 -->
  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#aaa">
    Generated by lowlighter/metrics | Updated daily
  </text>
</svg>