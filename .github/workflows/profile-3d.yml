name: Generate 3D contribution graph

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-contribution
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate contribution graph
        uses: yoshi389111/github-profile-3d-contrib@69fe3757279590c632c16189bb91445b51dc985f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Keep selected variant and commit changes
        shell: bash
        run: |
          set -euo pipefail
          selected="profile-3d-contrib/profile-night-green.svg"
          test -f "$selected"
          test ! -L "$selected"
          test -s "$selected"
          find profile-3d-contrib -mindepth 1 ! -path "$selected" -delete

          git add -A -- profile-3d-contrib

          if git diff --cached --quiet -- profile-3d-contrib; then
            echo "No 3D contribution changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update 3D contribution graph [skip ci]"
          git push
